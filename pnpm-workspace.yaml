packages:
  - "apps/*"
  - "packages/*"
  - "agents/*"
  - "tools/*"

# pnpm 11 refuses to run a dependency's install scripts unless it is listed here.
# Left unanswered it only WARNS locally but exits 1 in CI, which fails the deploy.
# esbuild reaches us solely through root dev tooling (tsup, tsx, vitest) and its
# postinstall links the platform binary, so it is allowed. Nothing in the shipped
# runtime depends on it.
allowBuilds:
  esbuild: true

# pnpm 11 reads overrides from HERE, not from package.json's "pnpm" field.
# Silently ignored in the wrong place, which is how a banned package sneaks back in.
overrides:
  "@hiero-ledger/sdk": "2.87.0"
  "@hashgraph/sdk": "npm:@hiero-ledger/sdk@2.87.0"

# One resolution for the Hedera SDK across the whole graph.
# Two copies => two `Transaction`/`AccountId` classes => silent signing failures.
# See docs/adr/0002-hiero-sdk-single-instance.md
catalog:
  hiero-sdk: 2.87.0
  x402: ~2.22.0
  zod: ^3.25.0
  fastify: ^5.4.0
  pino: ^9.7.0
  ioredis: ^5.6.0
  drizzle-orm: ^0.44.0
  bullmq: ^5.56.0
