packages:
  - "apps/*"
  - "packages/*"
  - "agents/*"
  - "tools/*"

# pnpm 11 refuses to run a dependency's install scripts unless it is listed here.
# Left unanswered it only WARNS locally but exits 1 in CI, which fails the deploy.
# esbuild reaches us solely through root dev tooling (tsup, tsx, vitest) and its
# postinstall links the platform binary, so it is allowed. Nothing in the shipped
# runtime depends on it.
allowBuilds:
  esbuild: true
  # Transitive dependency of @hiero-ledger/sdk. Its postinstall wires up the
  # protobuf runtime the SDK encodes transactions with.
  protobufjs: true

# pnpm 11 reads overrides from HERE, not from package.json's "pnpm" field.
# Silently ignored in the wrong place, which is how a banned package sneaks back in.
overrides:
  "@hiero-ledger/sdk": "2.87.0"
  "@hashgraph/sdk": "npm:@hiero-ledger/sdk@2.87.0"

# One version per dependency, for the whole workspace.
#
# pnpm catalogs are keyed by the REAL package name — a label like `x402` or
# `hiero-sdk` resolves to nothing, so `catalog:` references against it fail with
# ENTRY_NOT_FOUND. Reference these as `"@x402/core": "catalog:"`.
#
# Two copies of @hiero-ledger/sdk means two Transaction/AccountId classes and
# signing fails at request time. See docs/adr/0002-single-hedera-sdk.md.
catalog:
  "@hiero-ledger/sdk": 2.87.0
  "@x402/core": ~2.25.0
  "@x402/hedera": ~2.25.0
  "@x402/fetch": ~2.25.0
  "@x402/express": ~2.25.0
  "@x402/fastify": ~2.25.0
  "@x402/extensions": ~2.25.0
  "@hashgraph/hedera-agent-kit": ^4.1.0
  zod: ^4.5.4
  fastify: ^5.4.0
  pino: ^9.7.0
  ioredis: ^5.6.0
  drizzle-orm: ^0.44.0
  bullmq: ^5.56.0
