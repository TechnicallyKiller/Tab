name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs on a bare clone with no install, so a Solidity file or the wrong Hedera
  # SDK fails in seconds rather than after a five-minute build.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/guards/no-solidity.mjs
      - run: node tools/guards/single-hedera-sdk.mjs
      - run: node tools/guards/check-boundaries.mjs
      - run: node tools/guards/no-float-money.mjs
      - run: node tools/guards/no-secrets.mjs

  build:
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit

  # Needs real managed services, because a local Redis flatters the fast-path
  # latency number and the under-50ms budget is a published claim.
  integration:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:integration
      # Keeps ADR-0007 honest: HCS is truth, Postgres is a rebuildable projection.
      - run: pnpm --filter @tab/db test:rebuild
