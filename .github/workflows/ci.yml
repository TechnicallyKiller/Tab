name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs on a bare clone with no install, so a Solidity file or the wrong Hedera
  # SDK fails in seconds rather than after a five-minute build.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.20.0' }
      - run: node tools/guards/no-solidity.mjs
      - run: node tools/guards/single-hedera-sdk.mjs
      - run: node tools/guards/check-boundaries.mjs
      - run: node tools/guards/no-float-money.mjs
      - run: node tools/guards/no-secrets.mjs

  build:
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.20.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit

  # DISABLED until `@tab/db` and `@tab/cache` exist.
  #
  # This job called `pnpm db:migrate` and `pnpm --filter @tab/db test:rebuild`
  # against packages that were never written, so it failed on every push to main
  # — a red badge for work that had not started rather than for work that broke.
  # A CI job that cannot pass teaches everyone to ignore CI, which costs more
  # than the coverage it was aspiring to.
  #
  # Restore it with the packages. It needs real managed services rather than a
  # local Redis, because a co-located Redis flatters the fast-path latency
  # number and the under-50ms budget is a published claim.
  #
  # integration:
  #   runs-on: ubuntu-latest
  #   needs: build
  #   if: github.event_name == 'push'
  #   env:
  #     DATABASE_URL: ${{ secrets.DATABASE_URL }}
  #     REDIS_URL: ${{ secrets.REDIS_URL }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version: '22.20.0', cache: pnpm }
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm db:migrate
  #     - run: pnpm test:integration
