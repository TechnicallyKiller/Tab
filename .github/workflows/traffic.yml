# Keep the topic alive.
#
# The engine publishes ceilings and the settlement worker closes windows, but
# neither creates RECEIPTS — those only exist when an agent actually spends or
# earns. Without this, every receipt on the topic came from someone running a
# script by hand, so the console showed "0 rows" to anyone who looked between
# demos, and the ceiling sat at the starter floor because trailing revenue was
# always zero.
#
# A credit rail with no traffic cannot demonstrate credit. This is the traffic.
#
# It runs the SAME path a visitor takes: a plain seller URL with no price and no
# counterparty, because both belong to the seller. A generator that took a
# private shortcut would keep passing while the real path was broken — which is
# exactly what happened before.

name: traffic

on:
  schedule:
    # Every 30 minutes — and the previous value of every 10 was a mistake worth
    # recording, because it failed in a way that looked like nothing.
    #
    # GitHub delays scheduled runs under load and drops high-frequency ones
    # first. At 6 runs an hour this workflow never fired on schedule ONCE, and
    # the repo's other schedules — engine and settle, which had been reliable —
    # stopped with it: engine ran 25 minutes late, then not at all; settle 32
    # minutes late, then not at all. Nothing was disabled and no quota was
    # touched (152 of 3,000 minutes). The queue was simply being throttled.
    #
    # So this is not a keep-warm mechanism and must not be treated as one. It
    # exists to put receipts on the topic. Render suspends after 15 minutes
    # idle, which no cadence GitHub will honour can stay ahead of — warmth needs
    # something that actually runs on time, an external pinger or a hand on the
    # keyboard before a demo.
    #
    # Offset off :00 so it never lands on the engine (:17) or settle (:47).
    - cron: '3,33 * * * *'
  workflow_dispatch:
    inputs:
      calls:
        description: 'Spend attempts this run'
        required: false
        default: '4'

# One run at a time. Two concurrent generators would interleave holds against
# the same ceiling and make the ledger harder to read for no extra evidence.
concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  spend:
    runs-on: ubuntu-latest
    # Free-tier services sleep; a cold start plus four x402 settlements at
    # ~5s each needs room, but not unbounded room.
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Render suspends idle services and takes ~50s to wake. Waking them
      # BEFORE the run means the first spend is not racing a cold start, and a
      # service that never wakes fails here with a clear message rather than as
      # a mysterious timeout mid-purchase.
      - name: Wake the services
        run: |
          for url in "${{ vars.TAB_GATEWAY_URL }}" "${{ vars.SELLER_URL }}"; do
            echo "waking $url"
            curl -sS --max-time 90 --retry 3 --retry-all-errors "$url/health" || {
              echo "::error::$url did not answer /health"; exit 1; }
            echo
          done

      - name: Spend against the seller
        run: pnpm demo:honest
        env:
          TAB_GATEWAY_URL: ${{ vars.TAB_GATEWAY_URL }}
          SELLER_URL: ${{ vars.SELLER_URL }}
          DEMO_CALLS: ${{ inputs.calls || '4' }}
          # Which tab the receipts are filed against — the agent the console
          # displays, not the operator account that happens to fund it.
          TAB_ACCOUNT_ID: ${{ secrets.TAB_ACCOUNT_ID }}
          HEDERA_OPERATOR_ID: ${{ secrets.HEDERA_OPERATOR_ID }}
          USDC_TOKEN_ID: ${{ secrets.USDC_TOKEN_ID }}

      # Move tokens back to the start of the loop when the payer runs low.
      #
      # `/v1/earn` pays TO the operator, so operator -> payer -> earn -> operator
      # is a circuit and this returns the same tokens to the front of it. Testnet
      # USDC cannot be minted — it is treasuried at 0.0.5176, not by us — so
      # recycling is the only thing keeping this alive past a few hours.
      #
      # Threshold-guarded: above the floor it moves nothing and costs a mirror
      # read. Best-effort because a failed top-up still leaves the payer with
      # whatever it had, and the earn step below will say so loudly if that is
      # not enough.
      - name: Top up the demo payer
        continue-on-error: true
        run: pnpm topup 12.000000 4.000000
        env:
          HEDERA_NETWORK: testnet
          HEDERA_OPERATOR_ID: ${{ secrets.HEDERA_OPERATOR_ID }}
          HEDERA_OPERATOR_KEY: ${{ secrets.HEDERA_OPERATOR_KEY }}
          USDC_TOKEN_ID: ${{ secrets.USDC_TOKEN_ID }}
          DEMO_PAYER_ACCOUNT_ID: ${{ secrets.DEMO_PAYER_ACCOUNT_ID }}

      # Earning is the half that raises a ceiling. Spending alone only walks the
      # balance down, so a tab driven by purchases and nothing else stays
      # Unrated forever and the ceiling chart is a flat line.
      #
      # NOT continue-on-error, and the earlier version was wrong to be.
      #
      # It was marked optional so a sleeping earn service could not fail a run
      # that had already produced spend receipts. But those receipts are on
      # chain the moment they are written — a red job does not retract them —
      # so the only thing the flag protected was the tick mark. Meanwhile it
      # hid that this step had NEVER succeeded once: it was passing
      # DEMO_PAYER_ACCOUNT_ID to a script that reads PAYER_ACCOUNT_ID, so every
      # run died on a missing variable and reported success.
      #
      # A step whose entire purpose is the tier must not be able to fail
      # quietly.
      - name: Earn through the gateway
        run: pnpm demo:earn
        env:
          TAB_GATEWAY_URL: ${{ vars.TAB_GATEWAY_URL }}
          # 44 calls x 0.050000 = 2.200000 GROSS per run.
          #
          # Gross is not what counts. The only paying counterparty is weighted
          # at 33.6% — SHARED_FUNDING_ROOT, YOUNG_ACCOUNT and CONCENTRATED all
          # apply and multiply — so 2.200000 gross becomes 0.739200 attested,
          # which over TRAILING_WINDOWS (6) is 0.123200 per window and clears
          # the 0.100000 floor for tier C with room to spare.
          #
          # The earlier value of 14 was derived from GROSS and missed the
          # weighting entirely: 0.700000 gross yielded 0.235200 attested and
          # 0.039200 per window, well under the floor.
          #
          # This gets cheaper on its own — YOUNG_ACCOUNT lapses once the payer
          # passes the age threshold, raising the weight and holding the same
          # tier on fewer calls.
          EARN_CALLS: '44'
          TAB_ACCOUNT_ID: ${{ secrets.TAB_ACCOUNT_ID }}
          USDC_TOKEN_ID: ${{ secrets.USDC_TOKEN_ID }}
          HEDERA_OPERATOR_ID: ${{ secrets.HEDERA_OPERATOR_ID }}
          HEDERA_OPERATOR_KEY: ${{ secrets.HEDERA_OPERATOR_KEY }}
          # The DEMO payer, mapped onto the names fake-payer reads.
          #
          # PAYER_ACCOUNT_ID (0.0.10385196) holds no USDC and never has; the
          # account that actually carries the float is DEMO_PAYER_ACCOUNT_ID,
          # which is also the one `pnpm topup` refills. Mapping here keeps one
          # funded account rather than two half-configured ones.
          PAYER_ACCOUNT_ID: ${{ secrets.DEMO_PAYER_ACCOUNT_ID }}
          PAYER_ACCOUNT_KEY: ${{ secrets.DEMO_PAYER_ACCOUNT_KEY }}

      - name: What the topic looks like now
        if: always()
        run: |
          curl -sS --max-time 60 "${{ vars.TAB_GATEWAY_URL }}/v1/tabs/${{ secrets.TAB_ACCOUNT_ID }}" \
            | python3 -m json.tool || true
